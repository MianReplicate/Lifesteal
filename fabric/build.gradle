plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

apply from: '../publish.gradle'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}+${minecraft_version}"

    implementation("mysticdrew:common-networking-fabric:${common_networking_version}")
    implementation("mc.mian:indestructible-blocks:fabric-${indestructible_blocks_version}")
    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

configurations.all {
    resolutionStrategy.capabilitiesResolution.withCapability("mysticdrew:commonnetworking") {
        select("mysticdrew:common-networking-fabric:${common_networking_version}")
    }
}